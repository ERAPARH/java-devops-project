apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-devops-project-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-devops-project
  template:
    metadata:
      labels:
        app: java-devops-project
    spec:
      containers:
        - name: java-devops-project
          image: eraparh/my-app:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
